<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPressWala - Quality Pressing Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Poppins', sans-serif;
        }
        .brand-font {
            font-family: 'Roboto Condensed', sans-serif;
        }
        
        /* Custom Colors - Warm Professional Theme */
        :root {
            --primary: #1e40af;      /* Deep Blue */
            --secondary: #f59e0b;    /* Warm Amber/Gold */
            --accent: #0ea5e9;       /* Sky Blue */
            --dark: #0f172a;         /* Slate Dark */
            --light: #f8fafc;        /* Off White */
        }
        
        .bg-primary { background-color: var(--primary); }
        .bg-secondary { background-color: var(--secondary); }
        .text-primary { color: var(--primary); }
        .text-secondary { color: var(--secondary); }
        
        /* Gate Animation Styles */
        .gate-container {
            perspective: 1000px;
        }
        .gate-left {
            transform-origin: left center;
            background: linear-gradient(90deg, #1e3a8a 0%, #1e40af 30%, #3b82f6 60%, #1e40af 100%);
            box-shadow: inset -10px 0 20px rgba(0,0,0,0.3), 0 0 50px rgba(59, 130, 246, 0.3);
            position: relative;
            overflow: hidden;
        }
        .gate-right {
            transform-origin: right center;
            background: linear-gradient(90deg, #3b82f6 0%, #1e40af 40%, #1e3a8a 70%, #1e40af 100%);
            box-shadow: inset 10px 0 20px rgba(0,0,0,0.3), 0 0 50px rgba(59, 130, 246, 0.3);
            position: relative;
            overflow: hidden;
        }
        .gate-pattern {
            background-image: 
                repeating-linear-gradient(90deg, transparent, transparent 20px, rgba(255,255,255,0.1) 20px, rgba(255,255,255,0.1) 22px),
                repeating-linear-gradient(0deg, transparent, transparent 30px, rgba(255,255,255,0.05) 30px, rgba(255,255,255,0.05) 32px),
                radial-gradient(circle at 20% 50%, rgba(255,255,255,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(255,255,255,0.1) 0%, transparent 50%);
        }
        .gate-shimmer {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: gate-shimmer 3s infinite;
        }
        @keyframes gate-shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        .gate-handle {
            background: linear-gradient(135deg, #f59e0b 0%, #f97316 50%, #ea580c 100%);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.5), inset 0 0 10px rgba(255,255,255,0.3);
            border: 2px solid rgba(255,255,255,0.2);
        }
        .gate-handle-inner {
            background: linear-gradient(135deg, #92400e 0%, #78350f 100%);
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }
        
        /* Shimmer Effect */
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        
        /* Steam Animation */
        .steam {
            position: absolute;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 70%);
            border-radius: 50%;
            animation: steam-rise 3s ease-out infinite;
            filter: blur(8px);
        }
        @keyframes steam-rise {
            0% { transform: translateY(0) scale(1); opacity: 0.6; }
            100% { transform: translateY(-100px) scale(2); opacity: 0; }
        }
        
        /* Iron Float Animation */
        .iron-float {
            animation: iron-bounce 3s ease-in-out infinite;
        }
        @keyframes iron-bounce {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }
        
        /* Smooth Scroll */
        html {
            scroll-behavior: smooth;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #1e40af, #f59e0b);
            border-radius: 5px;
        }
        
        /* Card Hover Effects */
        .service-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .service-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 25px 50px -12px rgba(30, 64, 175, 0.25);
        }
        
        /* Button Shine Effect */
        .btn-shine {
            position: relative;
            overflow: hidden;
        }
        .btn-shine::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg);
            transition: all 0.5s;
            opacity: 0;
        }
        .btn-shine:hover::after {
            animation: shine 0.75s ease-out;
            opacity: 1;
        }
        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }
        
        /* Input Focus Animation */
        .input-animate:focus {
            transform: scale(1.02);
            box-shadow: 0 0 0 4px rgba(30, 64, 175, 0.1);
        }
        
        /* Slot Selection Animation */
        .slot-card {
            transition: all 0.3s ease;
        }
        .slot-card.selected {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            color: white;
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(30, 64, 175, 0.3);
        }
        
        /* Counter Animation */
        .counter-btn {
            transition: all 0.2s;
        }
        .counter-btn:active {
            transform: scale(0.9);
        }
        
        /* Loading Spinner */
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-50 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence, useAnimation } = window.Motion;

        // Icon Components
        const Icons = {
            Shirt: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>,
            Clock: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
            Star: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>,
            Truck: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>,
            Shield: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
            Phone: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>,
            MapPin: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>,
            Menu: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>,
            X: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            ChevronRight: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>,
            Sparkles: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>,
            Minus: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        };

        // Gate Opening Animation Component
        const GateAnimation = ({ onComplete }) => {
            const [phase, setPhase] = useState('initial'); // initial, opening, complete

            useEffect(() => {
                const timer1 = setTimeout(() => setPhase('opening'), 2000);
                const timer2 = setTimeout(() => {
                    setPhase('complete');
                    onComplete();
                }, 4000);
                
                return () => {
                    clearTimeout(timer1);
                    clearTimeout(timer2);
                };
            }, [onComplete]);

            return (
                <div className="fixed inset-0 z-50 gate-container overflow-hidden bg-slate-900">
                    {/* Background Pattern */}
                    <div className="absolute inset-0 opacity-10">
                        <div className="absolute inset-0" style={{
                            backgroundImage: `radial-gradient(circle at 2px 2px, rgba(255,255,255,0.15) 1px, transparent 0)`,
                            backgroundSize: '40px 40px'
                        }}></div>
                    </div>

                    {/* Steam Effects */}
                    <div className="absolute top-1/4 left-1/4 steam" style={{ animationDelay: '0s' }}></div>
                    <div className="absolute top-1/3 right-1/3 steam" style={{ animationDelay: '1s' }}></div>
                    <div className="absolute bottom-1/3 left-1/3 steam" style={{ animationDelay: '2s' }}></div>

                    {/* Center Content */}
                    <div className="absolute inset-0 flex items-center justify-center">
                        <AnimatePresence mode="wait">
                            {phase !== 'complete' && (
                                <motion.div
                                    initial={{ scale: 0.8, opacity: 0 }}
                                    animate={{ 
                                        scale: phase === 'opening' ? 0.3 : 1, 
                                        opacity: phase === 'opening' ? 0 : 1
                                    }}
                                    exit={{ opacity: 0, scale: 0.2 }}
                                    transition={{ duration: phase === 'opening' ? 1 : 0.5, ease: "easeInOut" }}
                                    className="text-center z-20"
                                >
                                    {/* Logo Container */}
                                    <div className="relative inline-block">
                                        <motion.div 
                                            animate={{ 
                                                rotate: phase === 'initial' ? [0, -5, 5, 0] : 0,
                                                scale: phase === 'initial' ? [1, 1.05, 1] : 1
                                            }}
                                            transition={{ repeat: phase === 'initial' ? Infinity : 0, duration: 2 }}
                                            className="w-48 h-48 md:w-64 md:h-64 relative"
                                        >
                                            <img 
                                                src="Screenshot_2026-02-22_175620-removebg-preview.png" 
                                                alt="MyPressWala" 
                                                className="w-full h-full object-contain drop-shadow-2xl"
                                            />
                                            {phase === 'initial' && (
                                                <motion.div 
                                                    className="absolute -bottom-4 left-1/2 transform -translate-x-1/2 w-32 h-4 bg-black/20 rounded-full blur-xl"
                                                    animate={{ scale: [1, 1.2, 1], opacity: [0.3, 0.5, 0.3] }}
                                                    transition={{ repeat: Infinity, duration: 2 }}
                                                />
                                            )}
                                        </motion.div>
                                    </div>
                                </motion.div>
                            )}
                        </AnimatePresence>
                    </div>

                    {/* Left Gate */}
                    <AnimatePresence>
                        {phase !== 'initial' && (
                            <motion.div 
                                className="absolute top-0 left-0 w-1/2 h-full gate-left gate-pattern z-10"
                                initial={{ rotateY: 0 }}
                                animate={{ rotateY: phase === 'opening' ? -110 : -110 }}
                                exit={{ rotateY: -110, opacity: 0 }}
                                transition={{ duration: 1.5, ease: [0.4, 0, 0.2, 1] }}
                            >
                                <div className="gate-shimmer"></div>
                                <div className="absolute inset-0 flex items-center justify-end pr-8">
                                    <div className="gate-handle w-20 h-40 rounded-l-full shadow-2xl flex items-center justify-center">
                                        <div className="gate-handle-inner w-6 h-20 rounded-full"></div>
                                    </div>
                                </div>
                                {/* Enhanced Gate Decoration */}
                                <div className="absolute top-1/4 left-1/4 w-40 h-40 border-4 border-white/20 rounded-full shadow-lg shadow-white/10"></div>
                                <div className="absolute top-1/4 left-1/4 w-32 h-32 border-2 border-white/15 rounded-full animate-pulse"></div>
                                <div className="absolute bottom-1/4 left-1/3 w-32 h-32 border-4 border-white/20 rounded-full shadow-lg shadow-white/10"></div>
                                <div className="absolute bottom-1/4 left-1/3 w-24 h-24 border-2 border-white/15 rounded-full animate-pulse"></div>
                                <div className="absolute top-1/2 left-1/6 w-16 h-16 border-2 border-amber-400/30 rounded-full animate-spin" style={{ animationDuration: '8s' }}></div>
                                <div className="absolute bottom-1/3 left-1/6 w-12 h-12 border-2 border-amber-400/20 rounded-full animate-spin" style={{ animationDuration: '6s' }}></div>
                            </motion.div>
                        )}
                    </AnimatePresence>

                    {/* Right Gate */}
                    <AnimatePresence>
                        {phase !== 'initial' && (
                            <motion.div 
                                className="absolute top-0 right-0 w-1/2 h-full gate-right gate-pattern z-10"
                                initial={{ rotateY: 0 }}
                                animate={{ rotateY: phase === 'opening' ? 110 : 110 }}
                                exit={{ rotateY: 110, opacity: 0 }}
                                transition={{ duration: 1.5, ease: [0.4, 0, 0.2, 1] }}
                            >
                                <div className="gate-shimmer"></div>
                                <div className="absolute inset-0 flex items-center justify-start pl-8">
                                    <div className="gate-handle w-20 h-40 rounded-r-full shadow-2xl flex items-center justify-center">
                                        <div className="gate-handle-inner w-6 h-20 rounded-full"></div>
                                    </div>
                                </div>
                                {/* Enhanced Gate Decoration */}
                                <div className="absolute top-1/3 right-1/4 w-36 h-36 border-4 border-white/20 rounded-full shadow-lg shadow-white/10"></div>
                                <div className="absolute top-1/3 right-1/4 w-28 h-28 border-2 border-white/15 rounded-full animate-pulse"></div>
                                <div className="absolute bottom-1/3 right-1/3 w-28 h-28 border-4 border-white/20 rounded-full shadow-lg shadow-white/10"></div>
                                <div className="absolute bottom-1/3 right-1/3 w-20 h-20 border-2 border-white/15 rounded-full animate-pulse"></div>
                                <div className="absolute top-1/2 right-1/6 w-16 h-16 border-2 border-amber-400/30 rounded-full animate-spin" style={{ animationDuration: '8s' }}></div>
                                <div className="absolute bottom-1/3 right-1/6 w-12 h-12 border-2 border-amber-400/20 rounded-full animate-spin" style={{ animationDuration: '6s' }}></div>
                            </motion.div>
                        )}
                    </AnimatePresence>

                    {/* Floor */}
                    <div className="absolute bottom-0 left-0 right-0 h-32 bg-gradient-to-t from-black/50 to-transparent z-0"></div>
                </div>
            );
        };

        // Navigation
        const Navbar = ({ visible }) => {
            const [scrolled, setScrolled] = useState(false);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            if (!visible) return null;

            return (
                <motion.nav 
                    initial={{ y: -100 }}
                    animate={{ y: 0 }}
                    transition={{ duration: 0.6, delay: 0.2 }}
                    className={`fixed w-full z-40 transition-all duration-300 ${scrolled ? 'bg-white/95 backdrop-blur-md shadow-lg' : 'bg-transparent'}`}
                >
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between items-center h-20">
                            <motion.a 
                                href="#"
                                whileHover={{ scale: 1.05 }}
                                className="flex items-center space-x-3"
                            >
                                <img src="Screenshot_2026-02-22_175620-removebg-preview.png" alt="Logo" className="w-16 h-16 object-contain" />
                                <span className={`text-2xl font-bold brand-font ${scrolled ? 'text-blue-900' : 'text-white'}`}>
                                    MyPressWala
                                </span>
                            </motion.a>
                            
                            <div className="hidden md:flex items-center space-x-8">
                                {['Services', 'Pricing', 'How it Works', 'Book Now'].map((item, index) => (
                                    <motion.a
                                        key={item}
                                        href={`#${item.toLowerCase().replace(/\s+/g, '-')}`}
                                        initial={{ opacity: 0, y: -20 }}
                                        animate={{ opacity: 1, y: 0 }}
                                        transition={{ delay: 0.1 * index }}
                                        whileHover={{ scale: 1.1, color: '#f59e0b' }}
                                        className={`text-sm font-semibold uppercase tracking-wider transition-colors ${scrolled ? 'text-slate-700' : 'text-white/90'}`}
                                    >
                                        {item}
                                    </motion.a>
                                ))}
                                <motion.a
                                    href="#book-now"
                                    whileHover={{ scale: 1.05 }}
                                    whileTap={{ scale: 0.95 }}
                                    className="px-6 py-2.5 bg-amber-500 text-white rounded-full font-semibold text-sm shadow-lg hover:bg-amber-600 transition-colors btn-shine"
                                >
                                    Schedule Pickup
                                </motion.a>
                            </div>

                            <button 
                                onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                                className="md:hidden p-2 text-current"
                            >
                                {mobileMenuOpen ? <Icons.X /> : <Icons.Menu />}
                            </button>
                        </div>
                    </div>

                    {/* Mobile Menu */}
                    <AnimatePresence>
                        {mobileMenuOpen && (
                            <motion.div
                                initial={{ opacity: 0, height: 0 }}
                                animate={{ opacity: 1, height: 'auto' }}
                                exit={{ opacity: 0, height: 0 }}
                                className="md:hidden bg-white border-t shadow-lg"
                            >
                                <div className="px-4 py-6 space-y-4">
                                    {['Services', 'Pricing', 'How it Works', 'Book Now'].map((item) => (
                                        <a
                                            key={item}
                                            href={`#${item.toLowerCase().replace(/\s+/g, '-')}`}
                                            onClick={() => setMobileMenuOpen(false)}
                                            className={`block text-slate-700 font-semibold hover:text-amber-500 transition-colors ${scrolled ? 'text-slate-700' : 'text-white'}`}
                                        >
                                            {item}
                                        </a>
                                    ))}
                                </div>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </motion.nav>
            );
        };

        // Hero Section
        const Hero = ({ visible }) => {
            if (!visible) return null;

            return (
                <section className="relative min-h-screen flex items-center justify-center overflow-hidden bg-gradient-to-br from-slate-900 via-slate-800 to-slate-700">
                    {/* Background Elements */}
                    <div className="absolute inset-0 overflow-hidden">
                        <div className="absolute top-20 left-10 w-72 h-72 bg-amber-500/40 rounded-full blur-3xl animate-pulse"></div>
                        <div className="absolute bottom-20 right-10 w-96 h-96 bg-blue-500/40 rounded-full blur-3xl animate-pulse delay-1000"></div>
                        <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-full h-full opacity-40">
                            <div className="absolute inset-0 bg-gradient-to-br from-slate-900/20 to-slate-800/20"></div>
                        </div>
                        
                        {/* Service Images Gallery */}
                        <div className="absolute inset-0 overflow-hidden pointer-events-none">
                            <motion.div

                                                x: Math.cos((i * 30) * Math.PI / 180) * 200,
                                                y: Math.sin((i * 30) * Math.PI / 180) * 200,
                                                opacity: 0,
                                                rotate: 360
                                            }}
                                            transition={{ duration: 1.5, delay: 0.3 }}

                                        />
                                    ))}

                            </motion.div>

                                        animate={{ opacity: 1, x: 0 }}

                                                    <div className="text-3xl mb-2">{slot.icon}</div>
                                                    <div className="font-bold text-lg mb-1">{slot.label}</div>
                                                    <div className="text-sm opacity-80">{slot.time}</div>

                                            ))}
                                        </div>
                                        <div className="flex gap-4">
                                            <motion.button
                                                type="button"
                                                whileHover={{ scale: 1.02 }}
                                                whileTap={{ scale: 0.98 }}

                                            >
                                                Back

                                            <motion.button
                                                type="button"
                                                whileHover={{ scale: 1.02 }}
                                                whileTap={{ scale: 0.98 }}
                                                onClick={() => formData.slot && setCurrentStep(3)}
                                                disabled={!formData.slot}
                                                className="flex-1 py-4 bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-xl font-bold shadow-lg disabled:opacity-50 disabled:cursor-not-allowed btn-shine"
                                            >
                                                Next: Item Count
                                            </motion.button>
                                        </div>
                                    </motion.div>
                                )}

                                                        <span className="text-2xl">{item.icon}</span>
                                                        <span className="text-white font-medium">{item.label}</span>
                                                    </div>
                                                    <div className="flex items-center space-x-3">
                                                        <motion.button
                                                            type="button"
                                                            whileTap={{ scale: 0.9 }}
                                                            onClick={() => updateCount(item.key, -1)}

                                                            onClick={() => updateCount(item.key, 1)}
                                                            className="counter-btn w-10 h-10 rounded-full bg-amber-500 text-white flex items-center justify-center hover:bg-amber-600 shadow-lg"

                                                        </motion.button>

                                        </div>

                                            <div className="flex justify-between items-center mb-2">
                                                <span className="text-white/80">Estimated Total</span>
                                                <span className="text-4xl font-bold text-amber-400 brand-font">₹{calculateTotal()}</span>
                                            </div>

                                                whileTap={{ scale: 0.98 }}
                                                onClick={() => setCurrentStep(2)}
                                                className="flex-1 py-4 bg-white/10 text-white rounded-xl font-bold border border-white/20 hover:bg-white/20 transition-all"
                                            >
                                                Back
                                            </motion.button>
                                            <motion.button
                                                type="submit"
                                                whileHover={{ scale: 1.02, boxShadow: "0 20px 40px rgba(245, 158, 11, 0.4)" }}
                                                whileTap={{ scale: 0.98 }}
                                                className="flex-1 py-4 bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-xl font-bold text-lg shadow-lg btn-shine"
                                            >
                                                Confirm Booking
                                            </motion.button>
                                        </div>
                                    </motion.div>
                                )}
                            </form>
                        </motion.div>
                    </div>
                </section>
            );
        };

        // Testimonials
        const Testimonials = ({ visible }) => {
            if (!visible) return null;

            const testimonials = [
                {
                    name: "Priya Sharma",
                    role: "IT Professional",
                    content: "Finally, a service that understands the luxury apartment lifestyle. The 4-hour delivery is a game changer for my busy schedule.",
                    rating: 5
                },
                {
                    name: "Rahul Mehta",
                    role: "Entrepreneur",
                    content: "The attention to detail is remarkable. My designer shirts have never looked better. Worth every rupee.",
                    rating: 5
                },
                {
                    name: "Ananya Reddy",
                    role: "Doctor",
                    content: "Reliable, professional, and the app interface is so smooth. Scheduling pickups between surgeries has never been easier.",
                    rating: 5
                }
            ];

            return (

                        <motion.div 
                            initial={{ opacity: 0, y: 20 }}
                            whileInView={{ opacity: 1, y: 0 }}
                            viewport={{ once: true }}
                            className="text-center mb-16"
                        >
                            <h2 className="text-4xl md:text-5xl font-bold text-slate-800 mb-4 brand-font">What Our Clients Say</h2>

                        <div className="grid md:grid-cols-3 gap-8">

                                    key={index}
                                    initial={{ opacity: 0, y: 30 }}
                                    whileInView={{ opacity: 1, y: 0 }}
                                    viewport={{ once: true }}
                                    transition={{ delay: index * 0.1 }}

                                    className="bg-white rounded-2xl p-8 shadow-lg border border-slate-100 relative overflow-hidden group"

                                    <div className="absolute top-0 right-0 w-32 h-32 bg-amber-100 rounded-full blur-3xl opacity-50 transform translate-x-16 -translate-y-16 group-hover:scale-150 transition-transform duration-500"></div>
                                    <div className="flex space-x-1 mb-4 relative z-10">
                                        {[...Array(testimonial.rating)].map((_, i) => (
                                            <Icons.Star key={i} />
                                        ))}
                                    </div>
                                    <p className="text-slate-600 mb-6 leading-relaxed italic relative z-10">"{testimonial.content}"</p>
                                    <div className="flex items-center space-x-4 relative z-10">
                                        <div className="w-12 h-12 rounded-full bg-gradient-to-br from-blue-500 to-amber-500 flex items-center justify-center text-white font-bold text-lg">
                                            {testimonial.name[0]}

                                        <div>
                                            <div className="font-bold text-slate-800">{testimonial.name}</div>
                                            <div className="text-sm text-slate-500">{testimonial.role}</div>
                                        </div>
                                    </div>
                                </motion.div>
                            ))}

            );

                                    <li><a href="#pricing" className="hover:text-amber-400 transition-colors">Pricing</a></li>
                                    <li><a href="#how-it-works" className="hover:text-amber-400 transition-colors">How it Works</a></li>

                                        <span>+91 80 1234 5678</span>
                                    </li>

                                        <Icons.MapPin />
                                        <span>Your City, Location</span>
                                    </li>
                                </ul>
                            </div>
                            
                            <div>
                                <h4 className="text-lg font-bold mb-6 text-amber-400">Service Areas</h4>
                                <div className="flex flex-wrap gap-2">
                                    {['Downtown', 'Uptown', 'Midtown', 'Westside', 'Eastside', 'Central'].map((area) => (

                                    ))}

                            </div>
                        </div>
                        
                        <div className="border-t border-white/10 pt-8 flex flex-col md:flex-row justify-between items-center">

                            <div className="flex space-x-6 mt-4 md:mt-0">
                                <a href="#" className="text-slate-400 hover:text-amber-400 transition-colors">Privacy Policy</a>
                                <a href="#" className="text-slate-400 hover:text-amber-400 transition-colors">Terms of Service</a>
                            </div>
                        </div>
                    </div>
                </footer>
            );
        };

        // Main App
        const App = () => {
            const [showGate, setShowGate] = useState(true);
            const [showContent, setShowContent] = useState(false);

            const handleGateComplete = () => {
                setShowGate(false);
                setShowContent(true);
            };

            return (
                <div className="min-h-screen bg-slate-50">
                    <AnimatePresence>
                        {showGate && <GateAnimation onComplete={handleGateComplete} />}
                    </AnimatePresence>
                    
                    <Navbar visible={showContent} />
                    <Hero visible={showContent} />
                    <Services visible={showContent} />
                    <Pricing visible={showContent} />
                    <HowItWorks visible={showContent} />
                    <BookingForm visible={showContent} />
                    <Testimonials visible={showContent} />
                    <Footer visible={showContent} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
